  pick(x,y){for(let i=this.bodies.length-1;i>=0;i--){const b=this.bodies[i],r=b.bounds;if(x>=r.minX&&x<=r.maxX&&y>=r.minY&&y<=r.maxY&&this.inside(b,x,y))return b}return null}

  move(x,y){if(this.drag&&[x,y].every(Number.isFinite)){this.drag.x=clamp(x,2,this.width-2);this.drag.y=clamp(y,2,this.height-2)}}

function traceLetterContours(data,width,height,stride=2){

});

<script>
(()=>{
'use strict';
const {SoftLetterWorld,traceLetterContours,toSVGPath}=MoushetteSoftLetters;
const AMBIENT=.85;
const $=id=>document.getElementById(id),story=$('story'),stage=$('stage'),letters=$('letters'),probe=$('probe');
const SVGNS='http://www.w3.org/2000/svg';
const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
let reduced=motionPreference.matches;
stage.setAttribute('aria-label',content.identity.displayName);
const nameLines=content.identity.nameLines.map(line=>line.toUpperCase().replace(/\s/g,''));
const name=nameLines.join('');

const surface=document.createElementNS(SVGNS,'svg');
surface.setAttribute('class','soft-surface');
surface.setAttribute('role','group');
surface.setAttribute('aria-label',content.identity.displayName);
letters.append(surface);

const glyphs=[...name].map((char,index)=>{
  const float=document.createElementNS(SVGNS,'g');
  const el=document.createElementNS(SVGNS,'path');
  el.setAttribute('class','soft-glyph');
  el.setAttribute('fill-rule','evenodd');
  el.setAttribute('tabindex','0');
  el.setAttribute('role','img');
  el.setAttribute('aria-label',char);
  float.append(el);surface.append(float);
  return{el,char,index};
});

let dims={w:0,h:0},world=null,progress=0,raf=0,lastTime=0;

function texture(char,font,metric,fontSize){
  const image=document.createElement('canvas'),ratio=Math.min(2,window.devicePixelRatio||1),pad=2;
  const width=Math.max(1,(metric.actualBoundingBoxLeft||0)+(metric.actualBoundingBoxRight??metric.width));
  const ascent=metric.actualBoundingBoxAscent||fontSize*.8,descent=metric.actualBoundingBoxDescent||0;
  image.width=Math.ceil((width+pad*2)*ratio);image.height=Math.ceil((ascent+descent+pad*2)*ratio);
  const ctx=image.getContext('2d');ctx.scale(ratio,ratio);ctx.font=font;ctx.fillStyle='#090909';ctx.textBaseline='alphabetic';
  ctx.fillText(char,(metric.actualBoundingBoxLeft||0)+pad,ascent+pad);
  return traceLetterContours(ctx.getImageData(0,0,image.width,image.height).data,image.width,image.height);
}

function layout(){
  const previous=world;
  dims={w:stage.clientWidth,h:stage.clientHeight};
  if(!dims.w||!dims.h)return;
  surface.setAttribute('viewBox','0 0 '+dims.w+' '+dims.h);
  const probeCtx=document.createElement('canvas').getContext('2d');
  const style=getComputedStyle(probe),font=style.fontWeight+' '+style.fontSize+' '+style.fontFamily;
  probeCtx.font=font;
  const gap=Math.max(3,Math.min(7,dims.w*.004)),fontSize=parseFloat(style.fontSize);
  let offset=0;
  const lines=nameLines.map(text=>{const line=glyphs.slice(offset,offset+text.length);offset+=text.length;return line})
    .map(line=>line.map(g=>{const m=probeCtx.measureText(g.char);return{g,m,width:(m.actualBoundingBoxLeft||0)+(m.actualBoundingBoxRight??m.width),height:(m.actualBoundingBoxAscent||fontSize*.8)+(m.actualBoundingBoxDescent||0)}}));
  const scale=Math.min(...lines.map(line=>(dims.w*.98-gap*(line.length-1))/line.reduce((sum,item)=>sum+item.width,0)));
  const maxHeight=Math.max(...lines.flat().map(item=>item.height));
  world=new SoftLetterWorld(dims.w,dims.h);
  lines.forEach((line,row)=>{
    const total=line.reduce((sum,item)=>sum+item.width*scale,0)+gap*(line.length-1);
    let cursor=(dims.w-total)/2;
    line.forEach(({g,m,width,height})=>{
      const w=width*scale,h=height/maxHeight*dims.h*.43;
      g.contours=texture(g.char,font,m,fontSize);
      g.body=world.add({index:g.index,x:cursor+w/2,y:(row?.735:.245)*dims.h,w,h,contours:g.contours});
      const prior=previous?.bodies[g.index];
      if(prior){const co=Math.cos(prior.angle),si=Math.sin(prior.angle),x=prior.x/previous.width*world.width,y=prior.y/previous.height*world.height;for(const n of g.body.nodes){n.x=x+co*n.rx-si*n.ry;n.y=y+si*n.rx+co*n.ry}world.updateBody(g.body)}
      cursor+=w+gap;
    });
  });
  world.setAmbient(reduced?0:AMBIENT);
  render();
}

function updateProgress(){
  const range=Math.max(1,story.offsetHeight-stage.clientHeight);
  progress=reduced?0:Math.max(0,Math.min(1,(scrollY-story.offsetTop)/range));
}

function render(){
  if(!world)return;
  surface.style.opacity=String(Math.max(0,Math.min(1,(.82-progress)/.32)));
  for(const g of glyphs){
    const side=g.index%4;
    const tx=(side===0?-dims.w*.52:side===1?dims.w*.5:side===2?-dims.w*.18:dims.w*.18)*progress;
    const ty=(side===2?-dims.h*.39:side===3?dims.h*.35:0)*progress;
    g.el.setAttribute('d',toSVGPath(world.contours(g.body)));
    g.el.setAttribute('transform','translate('+tx+' '+ty+')');
  }
}

function frame(time){
  raf=0;
  updateProgress();
  const live=!reduced&&!document.hidden&&progress<.85;
  if(live&&world.isActive()){const dt=lastTime?Math.min(2,(time-lastTime)/16.667):1;world.step(dt*.5);world.step(dt*.5)}
  lastTime=time;
  render();
  if(live)raf=requestAnimationFrame(frame);
}
function schedule(){if(!raf)raf=requestAnimationFrame(frame)}

function point(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
glyphs.forEach(g=>{
  let pointerId=null,start=null;
  g.el.addEventListener('pointerdown',e=>{
    if(e.button!==0||progress>.05||!world||world.drag)return;
    const p=point(e);pointerId=e.pointerId;start=p;
    world.grab(g.body,p.x,p.y);g.el.setPointerCapture(pointerId);schedule();
  });
  g.el.addEventListener('pointermove',e=>{if(pointerId!==e.pointerId||world.drag?.body!==g.body)return;const p=point(e);world.move(p.x,p.y);schedule()});
  const release=e=>{
    if(pointerId!==e.pointerId)return;pointerId=null;
    if(world.drag?.body!==g.body)return;
    const p=point(e),click=Math.hypot(p.x-start.x,p.y-start.y)<5;
    world.release(e.type!=='pointerup');
    if(click&&e.type==='pointerup')world.nudge(g.body);
    schedule();
  };
  g.el.addEventListener('pointerup',release);
  g.el.addEventListener('pointercancel',release);
  g.el.addEventListener('lostpointercapture',release);
  g.el.addEventListener('keydown',e=>{
    const moves={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]};
    if(moves[e.key]){e.preventDefault();const[x,y]=moves[e.key],s=e.shiftKey?3:1;world.nudge(g.body,x*s,y*s);schedule()}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();world.nudge(g.body);schedule()}
  });
});

window.addEventListener('scroll',()=>{if(world)world.release(true);schedule()},{passive:true});
window.addEventListener('resize',()=>{layout();lastTime=0;schedule()});
document.addEventListener('visibilitychange',()=>{lastTime=0;schedule()});
motionPreference.addEventListener('change',e=>{
  reduced=e.matches;
  if(world){world.release(true);world.setAmbient(reduced?0:AMBIENT)}
  lastTime=0;layout();schedule();
});

layout();updateProgress();render();schedule();
if(document.fonts)document.fonts.ready.then(()=>{layout();schedule()});
})();
</script>
</body>
</html>
